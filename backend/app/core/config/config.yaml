# 向量嵌入配置
embedding:
  model: BAAI/bge-small-zh-v1.5
  device: cpu
  max_length: 512 # 最大的输入长度，超过部分会被截断，单位为token
  local_path: "" # 本地模型路径，优先于model名加载；如 ./models/bge-small-zh-v1.5
  hf_endpoint: "https://hf-mirror.com" # HuggingFace镜像地址，解决国内访问问题
  offline: false # 离线模式，仅从本地加载模型

# 向量库配置
vector_store:
  type: chroma  # 可切换 chroma / milvus
  chroma:
    persist_dir: ./data/chroma
  milvus:
    host: localhost
    port: 19530
    collection_name: diet_knowledge

# LLM配置
llm:
  type: deepseek  # deepseek / qwen / openai
  api_key: "${LLM_API_KEY}"  # 使用环境变量占位符
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 4096

# Redis配置
redis:
  host: localhost
  port: 6379
  db: 0
  password: ""